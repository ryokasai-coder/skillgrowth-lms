<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証コード入力 - Skillgrowth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; }
    .brand-text { color: #fff; font-size: 1.4rem; font-weight: 700; }
    .brand-sub { color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="login-card p-3">
    <div class="text-center mb-4">
      <div class="mb-2"><i class="bi bi-shield-lock-fill text-primary" style="font-size:2.5rem"></i></div>
      <div class="brand-text">多要素認証</div>
      <div class="brand-sub">認証アプリのコードを入力してください</div>
    </div>
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST">
          <div class="mb-4">
            <label class="form-label">6桁の認証コード</label>
            <input type="text" name="code" class="form-control form-control-lg text-center"
                   inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code"
                   placeholder="000000" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check2-circle me-1"></i> 認証する
          </button>
        </form>
        <div class="mt-3 text-center">
          <a href="{{ url_for('login') }}" class="small text-muted">ログインに戻る</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
