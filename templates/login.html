<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - Skillgrowth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; }
    .brand-text { color: #fff; font-size: 1.4rem; font-weight: 700; }
    .brand-sub { color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="login-card p-3">
    <div class="text-center mb-4">
      <div class="mb-2"><i class="bi bi-mortarboard-fill text-primary" style="font-size:2.5rem"></i></div>
      <div class="brand-text">研修管理システム</div>
      <div class="brand-sub">学習管理システム</div>
    </div>
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4">
        <h5 class="card-title mb-4">ログイン</h5>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">ユーザー名</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i> ログイン
          </button>
        </form>
        <div class="mt-3 p-2 bg-light rounded small text-muted">
          <i class="bi bi-info-circle me-1"></i>
          初期管理者: <strong>admin</strong> / <strong>admin123</strong>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
