{% extends 'base.html' %}
{% block title %}パスワード変更{% endblock %}
{% block page_title %}パスワード変更{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    {% if current_user.force_password_change %}
    <div class="alert alert-warning">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      初回ログインのため、パスワードの変更が必要です。
    </div>
    {% endif %}
    <div class="card">
      <div class="card-body p-4">
        <h5 class="mb-4">新しいパスワードを設定</h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">新しいパスワード <span class="text-danger">*</span></label>
            <input type="password" name="new_password" class="form-control" required minlength="8"
                   placeholder="8文字以上">
            <div class="form-text">8文字以上で設定してください</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">パスワード確認 <span class="text-danger">*</span></label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-shield-check me-1"></i>パスワードを変更する
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
