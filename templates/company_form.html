{% extends 'base.html' %}
{% block title %}{% if company %}会社編集{% else %}会社登録{% endif %}{% endblock %}
{% block page_title %}{% if company %}会社情報編集{% else %}新規会社登録{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">会社名 <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ company.name if company else '' }}" required autofocus>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>{% if company %}更新{% else %}登録{% endif %}
            </button>
            <a href="{{ url_for('admin_companies') }}" class="btn btn-outline-secondary">戻る</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
