{# 助成金 監査対応帳票の出力フォーム。要: audit_users（絞り込み候補）、audit_companies（skillgrowthのみ。会社管理者は空＝自社固定） #}
<div class="card mb-3 border-primary">
  <div class="card-header bg-primary-subtle fw-semibold small">
    <i class="bi bi-file-earmark-check me-1"></i>助成金 支給申請・監査用 帳票出力
  </div>
  <div class="card-body">
    <form method="GET" class="row g-2 align-items-end">
      {% if audit_companies %}
      <div class="col-md-3">
        <label class="form-label small fw-semibold">事業所（会社）</label>
        <select name="company_id" class="form-select form-select-sm">
          <option value="">-- 全事業所（※10時間一覧は選択必須） --</option>
          {% for co in audit_companies %}
          <option value="{{ co.id }}" {% if selected_company == co.id %}selected{% endif %}>{{ co.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="col-md-3">
        <label class="form-label small fw-semibold">受講者（LMS情報の写しのみ・任意）</label>
        <select name="user_id" class="form-select form-select-sm">
          <option value="">-- 全員 --</option>
          {% for u in audit_users %}
          <option value="{{ u.id }}">{{ u.full_name or u.username }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-semibold">期間 開始（JST・任意）</label>
        <input type="date" name="from" class="form-control form-control-sm">
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-semibold">期間 終了（JST・任意）</label>
        <input type="date" name="to" class="form-control form-control-sm">
      </div>
      <div class="col-12 d-flex flex-wrap gap-2 mt-2">
        <button type="submit" formaction="{{ url_for('export_lms_copy_csv') }}" class="btn btn-success btn-sm">
          <i class="bi bi-file-earmark-spreadsheet me-1"></i>LMS情報の写し CSV
        </button>
        <button type="submit" formaction="{{ url_for('export_lms_copy_pdf') }}" class="btn btn-danger btn-sm">
          <i class="bi bi-file-earmark-pdf me-1"></i>LMS情報の写し PDF
        </button>
        <button type="submit" formaction="{{ url_for('export_ten_hours_csv') }}" class="btn btn-outline-success btn-sm">
          <i class="bi bi-file-earmark-spreadsheet me-1"></i>10時間以上の者の一覧表 CSV
        </button>
        <button type="submit" formaction="{{ url_for('export_ten_hours_pdf') }}" class="btn btn-outline-danger btn-sm">
          <i class="bi bi-file-earmark-pdf me-1"></i>10時間以上の者の一覧表 PDF
        </button>
      </div>
      <div class="col-12 small text-muted">
        10時間以上の一覧表は「修了した講座の標準学習時間（動画長合計）」を修了日順に累積し、10時間に達した講座の修了日を記載します。期間は到達日（開始〜終了）で絞り込みます。
      </div>
    </form>
  </div>
</div>
