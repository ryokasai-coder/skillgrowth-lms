# /etc/nginx/sites-available/skillgrowth-lms  (replace LMS_DOMAIN and 3080 if changed)
# After enabling: nginx -t && systemctl reload nginx ; then certbot --nginx -d LMS_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name LMS_DOMAIN;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their IP in study logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
